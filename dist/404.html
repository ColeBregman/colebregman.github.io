<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cole Bregman</title>
    <script>
      // GitHub Pages SPA redirect (rafgraph/spa-github-pages).
      // GitHub Pages serves this 404 for unknown paths like /project/Optics;
      // encode the path into the query string and bounce to index.html,
      // where the companion script restores the real URL for the router.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
