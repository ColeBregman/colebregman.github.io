<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ode. engine</title>
  <style>
    html, body { margin: 0; background: #f5f3ee; }
    #lcd { width: 240px; height: 240px; }
    /* controls exist only so app.js can wire to them; never interacted with here */
    #controls { position: absolute; left: -9999px; top: 0; }
  </style>
</head>
<body>
  <!-- app.js renders the round UI into #lcd and exposes window.puck; the 3D
       component maps this canvas onto the device screen and drives it via puck. -->
  <div id="device">
    <div id="encoderRing"></div>
    <canvas id="lcd" width="480" height="480"></canvas>
  </div>
  <div id="controls">
    <button id="btnNote"></button>
    <button id="btnQuote"></button>
    <button id="btnSkip"></button>
    <label><input type="checkbox" id="wiredToggle" checked /></label>
    <label><input type="checkbox" id="sndToggle" checked /></label>
    <label><input type="checkbox" id="pixToggle" /></label>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
