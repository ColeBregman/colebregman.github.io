    <!-- GitHub Pages SPA redirect decoder (rafgraph/spa-github-pages):
         404.html encodes deep links like /project/Optics into the query
         string; this restores the real URL before the router boots. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
