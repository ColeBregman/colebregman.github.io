<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ode. · interface simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #2b3757; --navy-deep: #1e2740; --teal: #0a7f73; }
    * { box-sizing: border-box; }
    html, body { background: transparent; margin: 0; }
    body {
      font-family: -apple-system, 'SF Pro Text', 'Inter', 'Segoe UI', system-ui, sans-serif;
      color: #1d1d1f; overflow: hidden;
    }
    main.embed {
      display: flex; align-items: center; justify-content: center;
      gap: 44px; height: 100vh; padding: 20px 24px; flex-wrap: wrap;
    }

    /* ---------- the handheld ---------- */
    .player {
      position: relative;
      width: 300px; height: 430px;
      margin-right: 30px;               /* room for the protruding wheel */
      background: linear-gradient(158deg, #fbfaf8 0%, #ece9e3 100%);
      border-radius: 48px 42px 66px 66px;
      box-shadow:
        0 34px 60px -24px rgba(28, 40, 80, 0.38),
        inset 0 2px 4px rgba(255, 255, 255, 0.9),
        inset 0 -10px 22px rgba(28, 40, 80, 0.06);
    }
    /* navy rail down the left, behind the two face buttons */
    .rail-navy {
      position: absolute; left: 0; top: 0; width: 94px; height: 208px;
      background: linear-gradient(150deg, #313d5f, var(--navy-deep));
      border-radius: 48px 22px 40px 48px;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.08),
                  inset -6px 0 14px rgba(0, 0, 0, 0.22);
    }
    /* front buttons */
    .face-btn {
      position: absolute; left: 19px; width: 56px; height: 56px; border-radius: 50%;
      border: 1px solid rgba(20, 26, 46, 0.18);
      background: radial-gradient(circle at 35% 30%, #ffffff, #e6e4de 78%);
      color: var(--navy); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 13px rgba(15, 20, 40, 0.38), inset 0 1px 2px rgba(255, 255, 255, 0.95);
      transition: transform 0.06s, box-shadow 0.06s;
    }
    .face-btn svg { width: 25px; height: 25px; }
    .face-btn.mic  { top: 30px; }
    .face-btn.mark { top: 116px; color: var(--teal); }
    .face-btn.pressed, .face-btn:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 2px 5px rgba(15, 20, 40, 0.42), inset 0 2px 5px rgba(15, 20, 40, 0.25);
    }
    /* side button on the left edge */
    .side-btn {
      position: absolute; left: -11px; top: 250px; width: 22px; height: 60px;
      border: none; border-radius: 7px 3px 3px 7px;
      background: linear-gradient(90deg, #c6c4be, #e6e4de);
      color: var(--navy); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: -4px 4px 9px rgba(28, 40, 80, 0.28), inset 1px 0 2px rgba(255, 255, 255, 0.8);
      transition: transform 0.06s;
    }
    .side-btn svg { width: 15px; height: 15px; }
    .side-btn:active { transform: translateX(2px); }
    /* knurled wheel, top-right, protruding */
    .wheel {
      position: absolute; right: -28px; top: 40px; width: 50px; height: 96px;
      border-radius: 13px;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.35), rgba(255,255,255,0.12) 20%, rgba(0,0,0,0.32) 50%, rgba(255,255,255,0.10) 80%, rgba(0,0,0,0.4)),
        repeating-linear-gradient(90deg, var(--navy-deep) 0 2px, #3a486b 2px 5px);
      background-color: var(--navy-deep);
      background-blend-mode: overlay, normal;
      box-shadow: 0 9px 20px rgba(15, 20, 40, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.16), inset 0 -8px 14px rgba(0, 0, 0, 0.4);
      cursor: grab; touch-action: none;
    }
    .wheel::after {
      content: ''; position: absolute; inset: 0; border-radius: 13px;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0 1px, rgba(0,0,0,0.18) 2px 4px);
      mix-blend-mode: soft-light;
    }
    .wheel:active { cursor: grabbing; }
    .wheel.pressed { filter: brightness(0.9); }
    /* round screen embedded low-centre */
    .screen-bezel {
      position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
      width: 208px; height: 208px; border-radius: 50%; padding: 9px;
      background: radial-gradient(circle at 36% 28%, #2c2c2e, #0a0a0b 72%);
      box-shadow: 0 0 0 3px #eae7e2, 0 6px 16px rgba(0,0,0,0.35), inset 0 2px 8px rgba(0,0,0,0.6);
      display: grid; place-items: center;
    }
    #lcd { width: 190px; height: 190px; border-radius: 50%; background: #f5f3ee; cursor: pointer;
           box-shadow: inset 0 0 22px rgba(0,0,0,0.10); }
    #lcd.pixel { image-rendering: pixelated; }

    /* ---------- side rail: hints + navigation ---------- */
    .rail { width: 290px; max-width: 88vw; display: flex; flex-direction: column; gap: 14px; }
    .rail .hint { margin: 0; font-size: 13px; line-height: 1.6; color: #4b4a45; }
    .rail .hint b { color: #1d1d1f; font-weight: 600; }
    .rail .hint .navy { color: var(--navy); font-weight: 600; }
    .rail .hint .teal { color: var(--teal); font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chips button {
      background: rgba(29,29,31,0.04); border: 1px solid rgba(29,29,31,0.10);
      color: #85837b; border-radius: 999px; padding: 5px 12px;
      font-size: 11.5px; font-family: inherit; cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .chips button:hover { color: #1c3f96; border-color: #2b57c4; }
    .opts { font-size: 12.5px; color: #85837b; }
    .opts summary { cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 10.5px; font-weight: 600; }
    .opts label { display: flex; align-items: center; gap: 9px; padding: 7px 0 0; cursor: pointer; }
    .opts input { accent-color: #2b57c4; }

    @media (max-width: 900px) {
      main.embed { flex-direction: column; gap: 26px; height: auto; padding: 24px 16px 34px; overflow: visible; }
      .rail { width: 340px; }
    }
  </style>
</head>
<body class="embed-body">
  <main class="embed">
    <div class="player" id="device">
      <div class="rail-navy"></div>

      <!-- top-left: microphone = record a voice note -->
      <button class="face-btn mic" id="btnNote" title="Record a voice note (mic)">
        <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zm-7 9a7 7 0 0 0 14 0M12 19v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- bottom-left: bookmark = save a quote -->
      <button class="face-btn mark" id="btnQuote" title="Save a quote — last 30 s (bookmark)">
        <svg viewBox="0 0 24 24"><path d="M6 3.5h12a1 1 0 0 1 1 1V20.5l-7-4.3-7 4.3V4.5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <!-- left edge: back 30 s / back -->
      <button class="side-btn" id="btnSkip" title="Back 30 s · Back">
        <svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- right: knurled wheel — turn / click = OK / hold = lock -->
      <div class="wheel" id="encoderRing" title="Turn to move · click = OK / play · hold to lock"></div>

      <div class="screen-bezel">
        <canvas id="lcd" width="480" height="480"></canvas>
      </div>
    </div>

    <div class="rail">
      <p class="hint">
        <b>Turn or scroll the wheel</b> to move — scrub on Now&nbsp;Playing, or through lists
        (press-and-turn with <b>Shift</b> for volume). <span class="navy">Click it</span> to play / pause
        and select; <span class="navy">hold it</span> to lock.
        The <b>mic</b> records a <span class="teal">voice note</span>, the <b>bookmark</b> saves a
        <span class="teal">quote</span>, and the side button skips back 30&nbsp;s.
      </p>
      <div class="chips">
        <button data-screen="home">Now Playing</button>
        <button data-screen="menu">Menu</button>
        <button data-screen="library">Library</button>
        <button data-screen="chapters">Chapters</button>
        <button data-screen="quotes">Quotes</button>
        <button data-screen="notes">Notes</button>
        <button data-screen="recall">Recall</button>
        <button data-screen="speed">Speed</button>
        <button data-screen="sleep">Sleep</button>
        <button data-screen="settings">Settings</button>
        <button data-screen="finished">Finished</button>
      </div>
      <details class="opts">
        <summary>Options</summary>
        <label><input type="checkbox" id="wiredToggle" checked /> Headphones plugged in (unplug = auto-pause)</label>
        <label><input type="checkbox" id="sndToggle" checked /> Encoder detent sounds</label>
        <label><input type="checkbox" id="pixToggle" /> True 240×240 pixels (real density)</label>
      </details>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
