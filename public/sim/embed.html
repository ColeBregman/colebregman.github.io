<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ode. · interface simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/sim.css" />
  <style>
    /* ---- embed overrides: transparent, compact, on-brand ---- */
    html, body { background: transparent; }
    body { min-height: 0; overflow: hidden; }
    main.embed {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      min-height: 0;
      height: 100vh;
      padding: 16px 20px;
      flex-wrap: wrap;
    }
    .device-wrap { gap: 20px; }
    .device { width: 380px; height: 380px; filter: drop-shadow(0 20px 44px rgba(29,29,31,0.20)); }
    .screen-bezel { width: 314px; height: 314px; }
    #lcd { width: 292px; height: 292px; }
    .hw-btn { width: 60px; height: 60px; }
    .hw-btn svg { width: 19px; height: 19px; }
    .hw-btn span { font-size: 9px; }
    .hw-btn.primary { width: 70px; height: 70px; }
    .btn-row { gap: 16px; }

    /* slim side rail (reuses .panel width var but its own content) */
    .rail { width: 288px; max-width: 88vw; display: flex; flex-direction: column; gap: 14px; }
    .rail .hint {
      margin: 0; font-size: 13px; line-height: 1.55; color: #4b4a45;
    }
    .rail .hint b { color: #1d1d1f; font-weight: 600; }
    .rail .hint .teal { color: #0a7f73; font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chips button {
      background: rgba(29,29,31,0.04); border: 1px solid rgba(29,29,31,0.10);
      color: #85837b; border-radius: 999px; padding: 5px 12px;
      font-size: 11.5px; font-family: inherit; cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .chips button:hover { color: #d8380e; border-color: #ff4f1f; }
    .opts { font-size: 12.5px; color: #85837b; }
    .opts summary { cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 10.5px; font-weight: 600; }
    .opts label { display: flex; align-items: center; gap: 9px; padding: 7px 0 0; cursor: pointer; }
    .opts input { accent-color: #ff4f1f; }

    @media (max-width: 900px) {
      main.embed { flex-direction: column; gap: 22px; height: auto; padding: 22px 16px 30px; overflow: visible; }
      .rail { width: 340px; }
    }
    @media (max-width: 420px) {
      .device { width: 322px; height: 322px; }
      .screen-bezel { width: 266px; height: 266px; }
      #lcd { width: 248px; height: 248px; }
    }
  </style>
</head>
<body class="embed-body">
  <main class="embed">
    <div class="device-wrap">
      <div class="device" id="device">
        <div class="ring" id="encoderRing" title="Drag or scroll to turn the encoder"></div>
        <div class="screen-bezel">
          <canvas id="lcd" width="480" height="480"></canvas>
        </div>
      </div>
      <div class="btn-row">
        <button class="hw-btn" id="btnSkip" title="Skip back 30 s (←)">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="currentColor"/></svg>
          <span>−30s</span>
        </button>
        <button class="hw-btn primary" id="btnPlay" title="Play / pause (Space) · hold to lock">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <span>Play</span>
        </button>
        <button class="hw-btn" id="btnBack" title="Back / menu (Esc)">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Back</span>
        </button>
        <button class="hw-btn note" id="btnNote" title="Voice note (N) — pauses playback while recording">
          <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zm-7 9a7 7 0 0 0 14 0M12 19v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Note</span>
        </button>
      </div>
    </div>

    <div class="rail">
      <p class="hint">
        <b>Scroll or drag the ring</b> to turn the encoder — volume on Now&nbsp;Playing, or scroll through lists.
        <b>Click the screen</b> to <span class="teal">capture the last 30&nbsp;s</span> as a quote.
        The buttons play, skip, go back, and take a <span class="teal">voice note</span>.
      </p>
      <div class="chips">
        <button data-screen="home">Now Playing</button>
        <button data-screen="menu">Menu</button>
        <button data-screen="library">Library</button>
        <button data-screen="chapters">Chapters</button>
        <button data-screen="quotes">Quotes</button>
        <button data-screen="notes">Notes</button>
        <button data-screen="recall">Recall</button>
        <button data-screen="speed">Speed</button>
        <button data-screen="sleep">Sleep</button>
        <button data-screen="settings">Settings</button>
        <button data-screen="finished">Finished</button>
      </div>
      <details class="opts">
        <summary>Options</summary>
        <label><input type="checkbox" id="wiredToggle" checked /> Headphones plugged in (unplug = auto-pause)</label>
        <label><input type="checkbox" id="sndToggle" checked /> Encoder detent sounds</label>
        <label><input type="checkbox" id="pixToggle" /> True 240×240 pixels (real density)</label>
      </details>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
